services:
  site:
    build: .
    image: maiknote-site:latest
    container_name: maiknote-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-80}/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
